name: issue gatekeeper

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-gatekeeper-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate-issue:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate issue content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_GATEKEEPER_DELETE_ABUSE: ${{ vars.ISSUE_GATEKEEPER_DELETE_ABUSE }}
        run: node .github/action_script/lintIssue.js
