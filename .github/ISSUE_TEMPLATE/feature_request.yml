name: 功能请求
description: 提出一个明确的功能诉求或改进建议。
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请说明真实使用场景、问题背景和期望方案。信息不足的 Issue 会被自动关闭。
  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 说明当前遇到的问题、限制或低效点。
      placeholder: 请描述为什么需要这个能力，以及当前方案有什么问题。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 描述你希望项目提供什么能力或行为。
      placeholder: 请描述你期望新增或调整的具体能力。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 描述你已经考虑过的替代方案；如果没有，也请说明原因。
      placeholder: 例如：已经尝试通过 xxx 规避，但存在 xxx 问题。
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景
      description: 描述谁会使用这个能力，以及它出现在什么工作流里。
      placeholder: 例如：编辑器用户在导入大型模型后，需要...
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可补充截图、链接、设计草图或相关上下文。
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，确认这不是重复需求。
          required: true
        - label: 我提供了明确的使用场景，而不是只有一句宽泛描述。
          required: true
